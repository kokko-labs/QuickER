# 機能要望フォーム。「困りごとベース」で書いてもらい、解決策ありきの要望でも背景を把握できるようにする
name: 機能要望（Feature request）
description: 新機能・改善の提案はこちらから
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提案ありがとうございます。（English is welcome — feel free to write in English.）
  - type: textarea
    id: problem
    attributes:
      label: 困りごと・ユースケース
      description: どんな場面で、何に困っているか。「解決したいこと」ベースで書いていただけると検討しやすいです
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 希望する解決策
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 代替案・現在の回避策（任意）
    validations:
      required: false
