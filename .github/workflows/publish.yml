# QuickER パッケージ公開ワークフロー（手動トリガのみ）
#
# 運用メモ:
# - 認証は Trusted Publishing（GitHub OIDC）。長期 API キーの管理・ローテーションは不要で、
#   NuGet/login が実行時に 1 時間有効の一時キーへ交換する（シークレット登録は不要）。
#   前提: nuget.org の Trusted Publishing ポリシー（Owner=kokko-labs / Repository=QuickER /
#   Workflow File=publish.yml）が有効であること。プライベートリポジトリの間、ポリシーは
#   「7 日間の仮アクティブ」状態で、初回公開の前に nuget.org 側で窓の再開始が必要になる場合がある
# - バージョンは Directory.Build.props の VersionPrefix で管理する
#   （公開済みの版は再公開不可なので、公開前に必ずバージョンを上げること）
# - dry_run=true（既定）では pack と検証までを行い、NuGet.org への push は行わない
#   （NuGet/login も dry_run では実行しない＝dry_run は nuget.org 側の状態に依存しない）
name: Publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true の場合は pack と検証のみを行い、NuGet.org への push は行わない"
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # Trusted Publishing（NuGet/login の OIDC トークン要求）に必要

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v7

      - name: .NET SDK をセットアップ
        # SDK 版の正本は global.json（ci.yml / release.yml と同じ）。dotnet-version: 10.0.x の
        # ままだと「インストールする版＝最新」「使う版＝global.json の解決」がねじれ、
        # ランナーのパッチ版次第で配布バイナリが手元の再現ビルドとバイト一致しなくなる
        # （v0.1.0 の検証で実測＝ハッシュ照合で済む確認が API 面比較の遠回りになった）
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: ビルド
        run: dotnet build QuickER.slnx

      - name: テスト
        run: dotnet test QuickER.slnx --no-build --logger "console;verbosity=normal"

      - name: パッケージ生成（ランタイム7種+CLI）
        # 上の「ビルド」ステップは Debug 構成だが、dotnet pack は .NET 8 以降の SDK 既定で
        # Release を対象にするため --no-build だと Release バイナリ不在で失敗する（NU5026）。
        # ここでは pack に事前ビルドをさせる（-c Release 明示・ci.yml の同名ステップと同じ規約）。
        # ContinuousIntegrationBuild=true はソースパスを /_/ へ正規化し、配布バイナリに
        # ビルドマシンのパス情報を一切残さないための決定的ビルド指定
        run: |
          dotnet pack src/QuickER.Runtime/QuickER.Runtime.csproj -c Release -p:ContinuousIntegrationBuild=true --output ${{ runner.temp }}/nupkg
          dotnet pack src/QuickER.Runtime.SqlServer/QuickER.Runtime.SqlServer.csproj -c Release -p:ContinuousIntegrationBuild=true --output ${{ runner.temp }}/nupkg
          dotnet pack src/QuickER.Runtime.Sqlite/QuickER.Runtime.Sqlite.csproj -c Release -p:ContinuousIntegrationBuild=true --output ${{ runner.temp }}/nupkg
          dotnet pack src/QuickER.Runtime.EntityFrameworkCore/QuickER.Runtime.EntityFrameworkCore.csproj -c Release -p:ContinuousIntegrationBuild=true --output ${{ runner.temp }}/nupkg
          dotnet pack src/QuickER.Runtime.InMemory/QuickER.Runtime.InMemory.csproj -c Release -p:ContinuousIntegrationBuild=true --output ${{ runner.temp }}/nupkg
          dotnet pack src/QuickER.Runtime.AspNetCore/QuickER.Runtime.AspNetCore.csproj -c Release -p:ContinuousIntegrationBuild=true --output ${{ runner.temp }}/nupkg
          dotnet pack src/QuickER.Runtime.Sync/QuickER.Runtime.Sync.csproj -c Release -p:ContinuousIntegrationBuild=true --output ${{ runner.temp }}/nupkg
          dotnet pack src/QuickER.Cli/QuickER.Cli.csproj -c Release -p:ContinuousIntegrationBuild=true --output ${{ runner.temp }}/nupkg

      - name: 生成物一覧を表示
        run: Get-ChildItem "${{ runner.temp }}/nupkg" -Recurse

      - name: パッケージ検証（README / アイコンの宣言・tools の .pdb 不在・版の一致）
        # dotnet pack 自身が守らない 3 点だけを見る（重複した検査は置かない）。push の前段に置き、
        # dry_run=true でも必ず走らせる＝壊れたパッケージが公開経路へ進めない。
        # 検証本体は scripts/verify-packages.ps1 で、ローカルでも同じものを実行できる。
        run: ./scripts/verify-packages.ps1 -NupkgDirectory "${{ runner.temp }}/nupkg"

      # 一時キーの有効期限は 1 時間のため、push の直前に取得する
      - name: NuGet.org へログイン（Trusted Publishing・dry_run=false のときのみ）
        if: ${{ inputs.dry_run == false }}
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: kokko-labs

      # dotnet nuget push のワイルドカード（"…/nupkg/*.nupkg"）は Windows ランナーの
      # 混在セパレータパスで 1 件も解決されず "File does not exist" になる（v0.1.0 の
      # 本番実行で実測）。PowerShell 側で列挙して 1 本ずつ push する（0 件は明示エラー・
      # 各パッケージの成否がログで判別できる利点もある）
      - name: NuGet.org へ push（dry_run=false のときのみ）
        if: ${{ inputs.dry_run == false }}
        run: |
          $packages = Get-ChildItem "${{ runner.temp }}/nupkg" -Filter *.nupkg

          if ($packages.Count -eq 0) { Write-Error "push 対象の .nupkg が 0 件です"; exit 1 }

          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
