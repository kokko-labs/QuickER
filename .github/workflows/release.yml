# QuickER GUI 配布ワークフロー（手動トリガのみ）
#
# 運用メモ:
# - Velopack で 2 チャンネル配布する: win-full（--self-contained true・ランタイム同梱）と
#   win-lite（--self-contained false・利用者は .NET 10 Desktop Runtime と ASP.NET Core Runtime の
#   インストールが必要。README に明記）。各チャンネルにつき vpk pack が Setup.exe と Portable zip を
#   生成する（計 4 成果物）
# - 自動更新はアプリが GitHub Releases の資産（releases.win-*.json 等）を読む方式のため、
#   vpk の出力ファイルはすべて Release へ添付する
# - バージョンは Directory.Build.props の VersionPrefix で管理する（NuGet パッケージとロックステップ）
# - dry_run=true（既定）では publish と vpk pack までを行い、両チャンネルの出力一式を
#   ワークフロー成果物としてアップロードする（Release の作成・タグ付けは行わない）
# - dry_run=false ではタグ v{Version} で GitHub Release を作成し、両チャンネルの出力を全部添付する
name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true の場合は publish と vpk pack のみを行い、GitHub Release の作成は行わない"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v7

      - name: .NET SDK をセットアップ
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: ビルド
        run: dotnet build QuickER.slnx -c Release

      - name: テスト
        run: dotnet test QuickER.slnx -c Release --no-build --logger "console;verbosity=normal"

      - name: バージョンを取得（Directory.Build.props の VersionPrefix）
        id: version
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $version = ($props.Project.PropertyGroup.VersionPrefix | Where-Object { $_ }) | Select-Object -First 1
          if (-not $version) { throw "VersionPrefix が Directory.Build.props から取得できませんでした" }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - name: GUI を publish（self-contained・win-full 用）
        run: dotnet publish src/QuickER.Gui/QuickER.Gui.csproj -c Release -r win-x64 --self-contained true -o ${{ runner.temp }}/publish-full

      - name: GUI を publish（フレームワーク依存・win-lite 用）
        run: dotnet publish src/QuickER.Gui/QuickER.Gui.csproj -c Release -r win-x64 --self-contained false -o ${{ runner.temp }}/publish-lite

      # PolyForm NC の Notices 条項（条文をコピーの受領者へ渡す義務）に対応するため、
      # ライセンス文書 2 種を両チャンネルの publish ディレクトリへ必ず同梱する
      - name: ライセンス文書を同梱
        run: |
          Copy-Item LICENSE, LICENSE-NC.md -Destination ${{ runner.temp }}/publish-full
          Copy-Item LICENSE, LICENSE-NC.md -Destination ${{ runner.temp }}/publish-lite

      - name: Velopack CLI (vpk) をインストール
        run: dotnet tool install --global vpk

      # 差分更新パッケージを生成するため既存リリースの資産を取得する。リポジトリ未公開の間や
      # 初回リリースでは資産が存在せず失敗するため、ワークフロー全体を止めないよう許容する
      - name: 既存リリースを取得（win-full・差分更新用）
        continue-on-error: true
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --channel win-full --outputDir ${{ runner.temp }}/releases-full

      - name: win-full を vpk pack（Setup.exe + Portable zip）
        run: vpk pack --packId QuickER --packVersion ${{ steps.version.outputs.version }} --packDir ${{ runner.temp }}/publish-full --mainExe QuickER.exe --icon assets/QuickER.ico --channel win-full --outputDir ${{ runner.temp }}/releases-full

      - name: 既存リリースを取得（win-lite・差分更新用）
        continue-on-error: true
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --channel win-lite --outputDir ${{ runner.temp }}/releases-lite

      - name: win-lite を vpk pack（Setup.exe + Portable zip）
        run: vpk pack --packId QuickER --packVersion ${{ steps.version.outputs.version }} --packDir ${{ runner.temp }}/publish-lite --mainExe QuickER.exe --icon assets/QuickER.ico --channel win-lite --outputDir ${{ runner.temp }}/releases-lite

      - name: 成果物をワークフロー成果物としてアップロード（dry_run 検証用・win-full）
        uses: actions/upload-artifact@v7
        with:
          name: QuickER-${{ steps.version.outputs.version }}-win-full
          path: ${{ runner.temp }}/releases-full

      - name: 成果物をワークフロー成果物としてアップロード（dry_run 検証用・win-lite）
        uses: actions/upload-artifact@v7
        with:
          name: QuickER-${{ steps.version.outputs.version }}-win-lite
          path: ${{ runner.temp }}/releases-lite

      - name: GitHub Release を作成して両チャンネルの成果物を添付（dry_run=false のときのみ）
        if: ${{ inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 自動更新（GithubSource）は Release の資産から releases.win-*.json 等の更新メタを
          # 読むため、vpk が出力したファイルは（Setup.exe / Portable zip / nupkg / メタとも）
          # すべて添付する
          $assets = Get-ChildItem -Path "${{ runner.temp }}/releases-full", "${{ runner.temp }}/releases-lite" -File | Select-Object -ExpandProperty FullName
          gh release create "v${{ steps.version.outputs.version }}" $assets --title "QuickER v${{ steps.version.outputs.version }}" --generate-notes
