# QuickER CI: push / PR ごとにビルドと全テストを実行する
#
# - ランナーは windows-latest（テストプロジェクトが net10.0-windows / WPF 依存のため Linux では実行不可）
# - Testcontainers による実 DB 統合テストは、ランナーで Linux コンテナが使えないため
#   フィクスチャの Docker 検出により自動スキップされる（ローカルの Docker 環境では全件実行される）
# - 生成コードの Roslyn コンパイル検証（GeneratedCodeCompilationTests）はここで常時実行される
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: .NET SDK をセットアップ
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: ビルド
        run: dotnet build QuickER.slnx

      - name: テスト
        run: dotnet test QuickER.slnx --no-build --logger "console;verbosity=normal"
