# QuickER CI: push / PR ごとにビルドと全テストを実行する
#
# - build-and-test（windows-latest）: 全体のビルド＋全テスト。QuickER.Tests は net10.0-windows / WPF
#   依存のため Windows が必須。Windows ランナーは Linux コンテナを起動できないため、Testcontainers 系は
#   このジョブではフィクスチャの Docker 検出によりスキップされる
# - integration-tests-linux（ubuntu-latest）: 切り出した QuickER.Tests.Integration（net10.0）を実 DB
#   コンテナで実行する＝実 DB 検証の唯一の CI 経路。厳格モード（QUICKER_REQUIRE_DOCKER=1）により
#   コンテナ起動失敗はスキップでなく失敗になる（壊れた Docker 構成がスキップ緑に化けない）
# - 生成コードの Roslyn コンパイル検証（CodegenCaseTests の行 compile-*）は windows ジョブで常時実行される
name: CI

on:
  push:
    branches: [main]
    # 除外するのはどのテストも読まないファイルだけ。docs/・ルート直下の *.md・LICENSE は
    # 文書のガード（DocsIndexParityTests・ClaudeMdParityTests・LicenseDocumentParityTests 等）が
    # 読むので除外しない＝文書だけの変更でも CI 全体（Windows ランナーと Ubuntu の統合テスト）が走る。
    # 実行枠は増えるが、ガードが走らずに文書の食い違いがマージされるほうが問題なので受け入れる。
    # 除外の範囲は WorkflowGuardTests が固定する（pull_request 側も同じ一覧にする）
    paths-ignore:
      - "tasks/**"
      - ".github/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/FUNDING.yml"
  pull_request:
    paths-ignore:
      - "tasks/**"
      - ".github/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/FUNDING.yml"

# public リポジトリでは fork からの PR でも実行されるため、GITHUB_TOKEN を読み取り専用へ明示的に絞る
permissions:
  contents: read

# 同じ PR へ続けて push したときは古い実行を取り消す。main への push は取り消さない
# （続けて push すると、前のコミットの検証結果が残らなくなるため）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# dotnet test は Microsoft.Testing.Platform（global.json の test.runner）で動く。その利用状況の送信を止める
env:
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"

jobs:
  # 実 DB 統合テスト（ubuntu＝Linux コンテナが使える唯一の GitHub ホストランナー）。
  # イメージ pull（SQL Server / PostgreSQL / MySQL / Oracle）を毎回行うため 10〜15 分程度かかるが、
  # windows ジョブと並走するので壁時計時間はほぼ増えない
  integration-tests-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: リポジトリを取得
        # サードパーティ／公式を問わずアクションは commit SHA で固定する（タグは可変＝上流の
        # タグ付け替えや乗っ取りで実行内容が黙って差し替わり得る）。更新は Dependabot の
        # github-actions エコシステム（.github/dependabot.yml）が PR として持ってくる
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: .NET SDK をセットアップ
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: 統合テスト（実 DB コンテナ・厳格モード）
        # QUICKER_REQUIRE_DOCKER=1: このジョブは Docker が確実にある環境なので、コンテナ起動失敗を
        # スキップへ変換せず失敗させる（詳細はテスト側 DockerRequirement のコメントを参照）
        env:
          QUICKER_REQUIRE_DOCKER: "1"
        run: dotnet test tests/QuickER.Tests.Integration/QuickER.Tests.Integration.csproj --output detailed

  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: .NET SDK をセットアップ
        # SDK 版の正本は global.json（rollForward: latestPatch）。フロート指定（10.0.x）だと
        # ランナーの SDK 更新（フィーチャーバンド跳ね）が新警告を持ち込み、TreatWarningsAsErrors で
        # 自分のコミットと無関係に CI が赤くなるため、更新のタイミングを global.json の書き換えに固定する
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: 整形チェック（CSharpier）
        # 整形はローカルの `csharpier format .` 運用だが、実行忘れを検知する仕掛けが無かった。
        # ここでは書き換えずに検査だけ行い、未整形ファイルがあれば失敗させる（差分は console に出る）。
        # ローカルのグローバルツールと同じ 1.3.0 を明示して、バージョン差による整形揺れで
        # CI だけが落ちる（あるいは通ってしまう）状態を避ける。
        # PATH への依存を避けるため、グローバルではなくランナーの一時領域へ入れて絶対パスで呼ぶ
        # （pack 検証ステップの ${{ runner.temp }}/nupkg と同じ流儀）。
        run: |
          dotnet tool install --tool-path ${{ runner.temp }}/csharpier csharpier --version 1.3.0
          ${{ runner.temp }}/csharpier/csharpier check .

      - name: ビルド
        run: dotnet build QuickER.slnx

      - name: 単発のテストの基点の数を戻す
        # 基点（PR は向き先の先端＝チェックアウトしたマージのコミットの第 1 親・main への push は直前のコミット）の数。
        # 無ければ（初回・7 日使われずにキャッシュが消えた・そのコミットで CI が走らなかった）前置きの鍵でいちばん新しい数を戻し、
        # 報告は「近似」と比べたコミットを書く。それも無ければ合計だけを書く。キャッシュは戻しと保存で同じパスを使う
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/oneoff-tests
          key: oneoff-tests-${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          restore-keys: oneoff-tests-

      - name: 単発のテストを数えて報告する
        # 影響の地図の守りのテストのソースの外の [Fact] / [Theory] を数え、基点との増減を Step Summary に書く（本体は
        # QuickER.Tests の OneOffTestCensusTests。環境変数が無い普段の実行では何もしない）。数では赤にしない。
        # continue-on-error は付けない（数えられないときは赤にする）
        env:
          QUICKER_ONEOFF_DIR: ${{ runner.temp }}/oneoff-tests
          QUICKER_ONEOFF_COMMIT: ${{ github.sha }}
          QUICKER_ONEOFF_BASE_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: dotnet test tests/QuickER.Tests/QuickER.Tests.csproj --no-build --filter "FullyQualifiedName~OneOffTestCensusTests.WriteSummary_FromEnvironment" --output detailed

      - name: 単発のテストの数を次の実行へ渡す
        # 鍵はこのコミット。PR の数は main から読めないので、main への push のときだけ残す
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/oneoff-tests
          key: oneoff-tests-${{ github.sha }}

      - name: テスト
        # テストが作る一時ファイル（SQLite の実ファイル DB・偽の app-server の一時フォルダなど）を、ランナーの
        # 一時領域（D: ドライブ）へ置く。既定の TEMP は C: のユーザープロファイルの下で、ファイルの作成と削除が遅い
        # （SQLite のジャーナルはトランザクションごとにファイルを作って消す）。
        # 結果は TRX でも書く（コンソールは表示名だけなので、テストのクラスごとの時間は TRX の完全修飾名で読む）。
        # ファイル名を指定しないと、プロジェクトごとに別の名前（アセンブリ名_TFM_アーキテクチャ.trx）で書かれる
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: dotnet test QuickER.slnx --no-build --output detailed --report-trx --results-directory "${{ runner.temp }}/test-results"

      - name: 変異テストの環境で同期の計画のテストを流す
        # 週 1 回の変異テスト（provider-sync-planner）の最初のテストの実行と同じ環境（Docker を飛ばし、種を減らす）で、
        # その環境が変えるテストだけを流す。環境の変数は起動スクリプトの表だけが持つ（ここには書かない）。
        # 種を減らすと外れるはずの表明が外れていないと、週 1 回の実行まで気づかずに Stryker が止まるので、PR で捕まえる。
        # ビルドは上の「ビルド」を使い回す（スクリプトが --no-build で流す）
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        shell: pwsh
        run: ./scripts/run-mutation.ps1 -Target provider-sync-planner -TestsOnly -OutputDirectory "${{ runner.temp }}/mutation-env"

      - name: テストの結果を保存
        # 失敗した実行にも残す（確かめたいのは失敗の結果）
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-and-test-trx
          path: ${{ runner.temp }}/test-results/*.trx
          retention-days: 14

      - name: サンプルの実行（samples/ec-order）
        # 利用者のプロジェクトを模した動くサンプル。QuickER 本体へは参照せず NuGet パッケージのみで、
        # チェックイン済みの生成コード＋DDL で SQLite ファイル DB を作成し CRUD を実演する（外部 DB 不要）。
        # DB ファイルは実行ファイルと同じ bin 配下に作られるため作業ディレクトリを汚さない。
        # サンプルの csproj は QuickER.slnx に入っているので、上の「ビルド」ステップでビルド済み
        run: dotnet run --project samples/ec-order/EcOrderSample/EcOrderSample.csproj --no-build

      - name: 3 階層サンプルの実行（samples/ec-order-remote）
        # クライアント → HTTP+JSON → サーバー → SQLite の実 2 プロセススモーク。
        # クライアントは接続リトライを内蔵しており、サーバーの起動待ちを吸収する。
        # サーバーは dotnet run ではなくビルド済み DLL を直接起動する（dotnet run は子プロセスに
        # 実体を生むため、親だけを止めるとサーバーが残留する。DLL 直接起動なら単一プロセス）。
        # サーバーとクライアントの csproj は QuickER.slnx に入っているので、上の「ビルド」ステップで
        # Debug 構成としてビルド済み（$serverDll のパスもそれを前提にする）
        shell: pwsh
        run: |
          $serverDll = "samples/ec-order-remote/EcOrderRemote.Server/bin/Debug/net10.0/EcOrderRemote.Server.dll"
          $server = Start-Process dotnet -ArgumentList $serverDll -PassThru -NoNewWindow
          try {
            dotnet run --project samples/ec-order-remote/EcOrderRemote.Client --no-build
            if ($LASTEXITCODE -ne 0) { throw "クライアントの実行が失敗しました（終了コード: $LASTEXITCODE）" }
          }
          finally {
            # 成否に関わらずサーバーを確実に停止する（残留プロセスでランナーを塞がない）
            if (-not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }

      - name: パッケージ生成検証（ランタイム7種+CLI）
        # 一覧・pack・検証の本体は scripts/pack-packages.ps1（publish.yml と共有。一覧をここへ写さない）。
        # 1 本ずつ終了コードを見て、続けて verify-packages.ps1 で README / アイコンの宣言・
        # tools の .pdb 不在・版の一致・本数を検証する
        run: ./scripts/pack-packages.ps1 -OutputDirectory "${{ runner.temp }}/nupkg"
