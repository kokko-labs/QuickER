# QuickER CI: push / PR ごとにビルドと全テストを実行する
#
# - build-and-test（windows-latest）: 全体のビルド＋全テスト。QuickER.Tests は net10.0-windows / WPF
#   依存のため Windows が必須。Windows ランナーは Linux コンテナを起動できないため、Testcontainers 系は
#   このジョブではフィクスチャの Docker 検出によりスキップされる
# - integration-tests-linux（ubuntu-latest）: 切り出した QuickER.Tests.Integration（net10.0）を実 DB
#   コンテナで実行する＝実 DB 検証の唯一の CI 経路。厳格モード（QUICKER_REQUIRE_DOCKER=1）により
#   コンテナ起動失敗はスキップでなく失敗になる（壊れた Docker 構成がスキップ緑に化けない）
# - 生成コードの Roslyn コンパイル検証（GeneratedCodeCompilationTests）は windows ジョブで常時実行される
name: CI

on:
  push:
    branches: [main]
    # ドキュメント・作業記録だけの変更ではフル CI（Windows ランナー・約 12 分の枠消費）を
    # 走らせない。ルート直下の *.md のみ除外し、src/ 配下の README（NuGet 同梱物）や
    # samples/ 配下の .g.md（ドリフト検知対象）の変更では従来どおり CI を実行する
    paths-ignore:
      - "docs/**"
      - "tasks/**"
      - "*.md"
      - "LICENSE"
      - ".github/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/FUNDING.yml"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "tasks/**"
      - "*.md"
      - "LICENSE"
      - ".github/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/FUNDING.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 実 DB 統合テスト（ubuntu＝Linux コンテナが使える唯一の GitHub ホストランナー）。
  # イメージ pull（SQL Server / PostgreSQL / MySQL / Oracle）を毎回行うため 10〜15 分程度かかるが、
  # windows ジョブと並走するので壁時計時間はほぼ増えない
  integration-tests-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v7

      - name: .NET SDK をセットアップ
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: 統合テスト（実 DB コンテナ・厳格モード）
        # QUICKER_REQUIRE_DOCKER=1: このジョブは Docker が確実にある環境なので、コンテナ起動失敗を
        # スキップへ変換せず失敗させる（詳細はテスト側 DockerRequirement のコメントを参照）
        env:
          QUICKER_REQUIRE_DOCKER: "1"
        run: dotnet test tests/QuickER.Tests.Integration/QuickER.Tests.Integration.csproj --logger "console;verbosity=normal"

  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v7

      - name: .NET SDK をセットアップ
        # SDK 版の正本は global.json（rollForward: latestPatch）。フロート指定（10.0.x）だと
        # ランナーの SDK 更新（フィーチャーバンド跳ね）が新警告を持ち込み、TreatWarningsAsErrors で
        # 自分のコミットと無関係に CI が赤くなるため、更新のタイミングを global.json の書き換えに固定する
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: 整形チェック（CSharpier）
        # 整形はローカルの `csharpier format .` 運用だが、実行忘れを検知する仕掛けが無かった。
        # ここでは書き換えずに検査だけ行い、未整形ファイルがあれば失敗させる（差分は console に出る）。
        # ローカルのグローバルツールと同じ 1.3.0 を明示して、バージョン差による整形揺れで
        # CI だけが落ちる（あるいは通ってしまう）状態を避ける。
        # PATH への依存を避けるため、グローバルではなくランナーの一時領域へ入れて絶対パスで呼ぶ
        # （pack 検証ステップの ${{ runner.temp }}/nupkg と同じ流儀）。
        run: |
          dotnet tool install --tool-path ${{ runner.temp }}/csharpier csharpier --version 1.3.0
          ${{ runner.temp }}/csharpier/csharpier check .

      - name: ビルド
        run: dotnet build QuickER.slnx

      - name: テスト
        run: dotnet test QuickER.slnx --no-build --logger "console;verbosity=normal"

      - name: サンプルのビルドと実行（samples/ec-order）
        # 利用者のプロジェクトを模した動くサンプル。QuickER 本体へは参照せず NuGet パッケージのみで、
        # チェックイン済みの生成コード＋DDL で SQLite ファイル DB を作成し CRUD を実演する（外部 DB 不要）。
        # DB ファイルは実行ファイルと同じ bin 配下に作られるため作業ディレクトリを汚さない。
        run: |
          dotnet build samples/ec-order/EcOrderSample/EcOrderSample.csproj
          dotnet run --project samples/ec-order/EcOrderSample/EcOrderSample.csproj --no-build

      - name: 3 階層サンプルのビルドと実行（samples/ec-order-remote）
        # クライアント → HTTP+JSON → サーバー → SQLite の実 2 プロセススモーク。
        # クライアントは接続リトライを内蔵しており、サーバーの起動待ちを吸収する。
        # サーバーは dotnet run ではなくビルド済み DLL を直接起動する（dotnet run は子プロセスに
        # 実体を生むため、親だけを止めるとサーバーが残留する。DLL 直接起動なら単一プロセス）。
        shell: pwsh
        run: |
          dotnet build samples/ec-order-remote/EcOrderRemote.Server/EcOrderRemote.Server.csproj
          dotnet build samples/ec-order-remote/EcOrderRemote.Client/EcOrderRemote.Client.csproj
          $serverDll = "samples/ec-order-remote/EcOrderRemote.Server/bin/Debug/net10.0/EcOrderRemote.Server.dll"
          $server = Start-Process dotnet -ArgumentList $serverDll -PassThru -NoNewWindow
          try {
            dotnet run --project samples/ec-order-remote/EcOrderRemote.Client --no-build
            if ($LASTEXITCODE -ne 0) { throw "クライアントの実行が失敗しました（終了コード: $LASTEXITCODE）" }
          }
          finally {
            # 成否に関わらずサーバーを確実に停止する（残留プロセスでランナーを塞がない）
            if (-not $server.HasExited) { Stop-Process -Id $server.Id -Force }
          }

      - name: パッケージ生成検証（ランタイム7種+CLI）
        # 上の「ビルド」ステップは Debug 構成だが、dotnet pack は .NET 8 以降の SDK 既定で
        # Release を対象にするため --no-build だと Release バイナリ不在で失敗する（NU5026）。
        # ここでは pack に事前ビルドをさせる（-c Release 明示・対象 7 プロジェクトのみの小さなグラフ）
        run: |
          dotnet pack src/QuickER.Runtime/QuickER.Runtime.csproj -c Release --output ${{ runner.temp }}/nupkg
          dotnet pack src/QuickER.Runtime.SqlServer/QuickER.Runtime.SqlServer.csproj -c Release --output ${{ runner.temp }}/nupkg
          dotnet pack src/QuickER.Runtime.Sqlite/QuickER.Runtime.Sqlite.csproj -c Release --output ${{ runner.temp }}/nupkg
          dotnet pack src/QuickER.Runtime.EntityFrameworkCore/QuickER.Runtime.EntityFrameworkCore.csproj -c Release --output ${{ runner.temp }}/nupkg
          dotnet pack src/QuickER.Runtime.InMemory/QuickER.Runtime.InMemory.csproj -c Release --output ${{ runner.temp }}/nupkg
          dotnet pack src/QuickER.Runtime.AspNetCore/QuickER.Runtime.AspNetCore.csproj -c Release --output ${{ runner.temp }}/nupkg
          dotnet pack src/QuickER.Runtime.Sync/QuickER.Runtime.Sync.csproj -c Release --output ${{ runner.temp }}/nupkg
          dotnet pack src/QuickER.Cli/QuickER.Cli.csproj -c Release --output ${{ runner.temp }}/nupkg
