; Vale（https://vale.sh）の設定。英語の文書を機械検査するために使う。
; 日本語の文書は natural-japanese / japanese-tech-writing のスキル側で見る。
;
; 使い方:
;   vale sync              スタイルパッケージを .vale/styles へ取得する（初回のみ）
;   vale docs/cli.md       1 ファイルを検査する
;   vale docs/             フォルダを検査する
;   vale --glob='*.md' .   リポジトリ全体の Markdown を検査する
;
; リポジトリ直下で素の vale . を実行しないこと。csproj / resx などの XML まで対象に
; しようとして xsltproc を要求し、E100 で止まる。
;
; 手元にグローバル設定（%LOCALAPPDATA%\vale\.vale.ini など）があると、Vale は
; この設定を置き換えず「追加で」読み込む。このリポジトリの基準だけで見たいときは
; vale --no-global を付ける。
;
; 終了コードが 1 になるのは error のときだけで、warning と suggestion は 0 のまま。
; 件数ではなく severity が閾値であることに注意する。

StylesPath = .vale/styles
MinAlertLevel = suggestion

Packages = Google, write-good

; QuickER の固有名詞と技術語彙。Vale.Spelling の誤検知を抑える。
; 実体は .vale/styles/config/vocabularies/QuickER/accept.txt
Vocab = QuickER

[*.md]
BasedOnStyles = Vale, Google, write-good

; E-Prime は be 動詞をすべて禁じる特殊な作文制約であり、技術文書の規範ではない。
write-good.E-Prime = NO

; Vale.Terms は accept.txt の綴りを本文全体へ強制する規則で、このリポジトリでは
; 成立しない。QuickER は方言キーの sqlite と製品名の SQLite、サブコマンドの mcp と
; プロトコルの MCP、名前空間の Runtime と一般語の runtime を意図的に使い分けており、
; どちらも正しい。accept.txt は綴りの許可リストとしてだけ使う。
Vale.Terms = NO

; Google.Spacing は「ピリオドの後ろに空白が 1 つ」を見る規則だが、.NET の名前空間
; 表記（QuickER.Runtime.Sqlite）を文の切れ目と誤認する。このリポジトリでは検出が
; 全件この誤検知で、見出しにも本文にも出るため無効化する。
Google.Spacing = NO

; CHANGELOG は追記専用の履歴で、過去の項目を文体のために書き直すことはない。
; 綴りだけを見たいので、散文の規範（受動態・見出し・ダッシュ）は当てない。
[CHANGELOG.md]
BasedOnStyles = Vale

; ---- 対象外 ----
; 以下の 5 節は Vale を丸ごと止める。BasedOnStyles を空にするだけでは Vale 組み込みの
; 3 規則（Spelling / Terms / Repetition）が残るため、明示的に NO を書く。

; 日本語の文書。Vale の規則は英語の統語と辞書を前提にしており、当てても意味がない。
[*.ja.md]
BasedOnStyles =
Vale.Spelling = NO
Vale.Terms = NO
Vale.Repetition = NO

; CLAUDE.md は日本語のエージェント向け内部文書。
; LICENSE-NC.md と THIRD-PARTY-NOTICES.md は逐語の法務文書で、手を入れてはならない。
[{CLAUDE,LICENSE-NC,THIRD-PARTY-NOTICES}.md]
BasedOnStyles =
Vale.Spelling = NO
Vale.Terms = NO
Vale.Repetition = NO

; API リファレンス（*.g.md）は図から機械生成される。文面はテンプレート側で決まる。
[*.g.md]
BasedOnStyles =
Vale.Spelling = NO
Vale.Terms = NO
Vale.Repetition = NO

; ビルド出力（.gitignore 済み。Vale は .gitignore を見ないため明示する）。
[artifacts/**]
BasedOnStyles =
Vale.Spelling = NO
Vale.Terms = NO
Vale.Repetition = NO

; エージェント向けのスキル定義。製品の文書ではない。
[.claude/**]
BasedOnStyles =
Vale.Spelling = NO
Vale.Terms = NO
Vale.Repetition = NO
